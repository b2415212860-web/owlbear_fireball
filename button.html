<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>火球术</title>
  </head>
  <body class="button-page">
    <button id="fireball-button" class="fireball-button" type="button" aria-label="释放火球术">
      <span class="fireball-button__orb" aria-hidden="true">
        <span class="fireball-button__core"></span>
      </span>
      <span class="fireball-button__copy">
        <strong>火球术</strong>
        <small id="button-hint">点击瞄准</small>
      </span>
    </button>
    <div class="fireball-options">
      <select id="quality" aria-label="特效质量"><option value="auto">自动画质</option><option value="standard">标准 · 3D</option><option value="low">低配 · 3D</option></select>
      <button id="reset" type="button">恢复</button>
    </div>
    <section class="fireball-residue" aria-label="全房间残留素材设置">
      <div class="fireball-options">
        <button id="residue-select" type="button" disabled>由 GM 设置</button>
        <button id="residue-clear" type="button" title="关闭后续施法的残留，不删除已有道具" disabled>关闭</button>
      </div>
      <small id="residue-name" aria-live="polite">未设置 · 无残留</small>
    </section>
    <script type="module" src="/src/button.ts"></script>
  </body>
</html>
